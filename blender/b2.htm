<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>部屋内で選択できるオブジェクト</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable, .menuBtn"
    >

      <!-- ===== 部屋全体の親（ビッグライト用） ===== -->
      <a-entity id="roomRoot" scale="1 1 1">

        <!-- 部屋 -->
        <a-entity
          gltf-model="heya_new.glb"
          position="0 1.5 -0.5"
          scale="1.2 1.2 1.2">
        </a-entity>

        <!-- ドラえもん -->
        <a-entity
          id="box1"
          class="clickable"
          gltf-model="dora.glb"
          position="-1.2 1.1 -0.3"
          scale="0.2 0.2 0.2"
          rotation="0 90 0">
        </a-entity>

        <!-- 閉じたどこでもドア -->
        <a-entity
          id="closedDoor"
          class="clickable"
          gltf-model="../cdoor.glb"
          position="-1.0 1.25 -1.5"
          scale="0.5 0.5 0.5"
          rotation="0 400 0"
          visible="true">
        </a-entity>
        
       

        <!-- 開いたどこでもドア -->
        <a-entity
          id="openDoor"
          class="clickable"
          gltf-model="door.glb"
          position="-1.0 1.25 -1.5"
          scale="0.5 0.5 0.5"
          rotation="0 220 0"
          visible="false">
        </a-entity>
        

        <!-- ドアの向こう（富士山） -->
        <a-plane
          id="fujiPlane"
          src="../png/fuji.jpeg"
          position="-1.1 1.25 -1.65
          rotation="0 -15 0"
          width="0.6"
          height="1.1"
          visible="false">
        </a-plane>

        <!-- ビッグライト -->
        <a-entity
          id="box3"
          class="clickable"
          gltf-model="b.glb"
          position="-0.3 0.9 -0.4"
          scale="0.1 0.1 0.1">
        </a-entity>

      </a-entity>

      <!-- ===== UIメニュー ===== -->
      <a-entity id="menu" visible="false" position="-0.3 1.3 -0.8">
        <a-plane color="#222" width="1.2" height="0.6" opacity="0.85"></a-plane>

        <a-text
          id="menuTitle"
          value=""
          align="center"
          position="0 0.2 0.05"
          width="1"
          color="#FFF">
        </a-text>

        <!-- 使用する -->
        <a-entity position="-0.33 -0.12 0">
          <a-box
            id="btnUse"
            class="menuBtn"
            color="#4CAF50"
            depth="0.05"
            height="0.144"
            width="0.44">
            <a-image
              src="../png/siyou.PNG"
              width="0.44"
              height="0.16"
              position="0 0 0.03">
            </a-image>
          </a-box>
        </a-entity>

        <!-- 戻る -->
        <a-entity position="0.33 -0.12 0">
          <a-box
            id="btnBack"
            class="menuBtn"
            color="#E53935"
            depth="0.05"
            height="0.144"
            width="0.44">
            <a-image
              src="../png/modo.PNG"
              width="0.44"
              height="0.16"
              position="0 0 0.03">
            </a-image>
          </a-box>
        </a-entity>
      </a-entity>

      <!-- ===== カメラ ===== -->
      <a-entity
        id="camera"
        camera
        look-controls
        wasd-controls
        position="0 1.0 -1">
        
        <a-plane
	    id="flash"
	    color="#FFFFFF"
	    width="5"
	    height="10"
	    position="0 -2 -0.5"
	    visible="false">
	  </a-plane>
      </a-entity>

      <!-- VRコントローラ -->
      <a-entity
      	id="rightHand"
        laser-controls="hand: right"
        raycaster="objects: .clickable, .menuBtn; showLine: true">
      </a-entity>

    </a-scene>

    <!-- ===== JS ===== -->
    <script>
      let currentObject = null;
      let bigLightUsed = false;

      // オブジェクトクリック → メニュー表示
      $('#closedDoor, #box3').on('click', function () {
        currentObject = this.id;

        $('#menuTitle').attr(
          'value',
          currentObject === 'closedDoor'
            ? 'どこでもドア'
            : 'ビッグライト'
        );

        $('#menu').attr('visible', true);
      });

      // 使用する
      $('#btnUse').on('click', function () {
        if (!currentObject) return;

        // どこでもドア
        if (currentObject === 'closedDoor') {
          $('#closedDoor').attr('visible', false);
          $('#openDoor').attr('visible', true);
          $('#fujiPlane').attr('visible', true);
        }

        // ビッグライト
if (currentObject === 'box3' && !bigLightUsed) {
  bigLightUsed = true;

  // ===== フラッシュ表示 =====
  const flash = document.querySelector('#flash');
  flash.setAttribute('visible', true);

  // 0.3秒後に消す
  setTimeout(() => {
    flash.setAttribute('visible', false);
  }, 300);

  // ===== フラッシュ後に巨大化 =====
  setTimeout(() => {
    const scale = 1.8;

    // 部屋を巨大化
    $('#roomRoot').attr('scale', `${scale} ${scale} ${scale}`);

    // 床補正
    const floorBaseY = 0.6;
    const offsetY = -(scale - 1) * floorBaseY;
    $('#roomRoot').attr('position', `0 ${offsetY} 0`);

    // ===== ビッグライトを手に持たせる =====
    const bigLight = document.querySelector('#box3');
    const hand = document.querySelector('#rightHand');

    hand.appendChild(bigLight);
    bigLight.setAttribute('position', '0 -0.05 -0.1');
    bigLight.setAttribute('rotation', '0 180 0');
    bigLight.setAttribute('scale', '0.15 0.15 0.15');

  }, 180); // フラッシュ直後
}


        $('#menu').attr('visible', false);
      });

      // 戻る
      $('#btnBack').on('click', function () {
        $('#menu').attr('visible', false);
      });
    </script>
  </body>
</html>
