<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>部屋内で選択できるオブジェクト</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >

      <!-- Blenderで作った部屋 -->
      <a-entity gltf-model="heya_new.glb" position="0 1 -0.5" scale="1.2 1.2 1.2"></a-entity>

      <!-- ドラえもん -->
      <a-entity
        id="box1"
        class="clickable"
        gltf-model="https://drive.google.com/uc?export=download&id=1fz6yVwA95KVjrtPGwvayStxyBAIjeS-Q"
        position="-1.2 0.8 -0.3"
        scale="0.28 0.28 0.28"
        rotation="0 90 0"
      ></a-entity>

      <!-- どこでもドア -->
      <a-entity
        id="box2"
        class="clickable"
        gltf-model="https://drive.google.com/uc?export=download&id=1AqpCLW-tEUyeNrWvphnFdoirPZaSBzF6"
        position="-0.3 0.8 -1"
        scale="0.42 0.42 0.42"
        rotation="0 270 0"
      ></a-entity>

      <!-- 色が変わる箱 -->
      <a-box
        id="box3"
        class="clickable"
        position="-0.3 0.4 -0.4"
        depth="0.1"
        height="0.1"
        width="0.1"
        color="orange"
      ></a-box>

      <a-entity camera look-controls wasd-controls position="0 1.6 -1"></a-entity>

      <!-- コントローラー -->
      <a-entity
        id="ctlR"
        laser-controls="hand: right"
        raycaster="objects: .clickable; showLine: true; lineColor: red;"
      ></a-entity>
    </a-scene>

    <script>
      // ドラえもんクリックで拡大
      $('#box1').on('click', function () {
        let scale = $(this).attr('scale').split(" ");
        let newScale = `${scale[0] * 1.2} ${scale[1] * 1.2} ${scale[2] * 1.2}`;
        $(this).attr('scale', newScale);
      });

      // どこでもドアクリックで拡大
      $('#box2').on('click', function () {
        let scale = $(this).attr('scale').split(" ");
        let newScale = `${scale[0] * 1.2} ${scale[1] * 1.2} ${scale[2] * 1.2}`;
        $(this).attr('scale', newScale);
      });
