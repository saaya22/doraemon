<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>部屋内で選択できるオブジェクト</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <a-scene
      renderer="colorManagement: true; physicallyCorrectLights: true"
      background="color: #ECECEC"
      vr-mode-ui="enabled: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable">

      <!-- ===== ライト（超重要：初期白黒防止） ===== -->
      <a-light type="ambient" intensity="0.7"></a-light>

      <a-light
        type="directional"
        intensity="0.9"
        position="1 3 2">
      </a-light>
      <!-- =========================================== -->

      <!-- 部屋 -->
      <a-entity
        gltf-model="heya_new.glb"
        position="0 1.5 -0.5"
        scale="1.2 1.2 1.2">
      </a-entity>

      <!-- ドラえもん -->
      <a-entity
        class="clickable"
        gltf-model="dora.glb"
        position="-1.2 1.1 -0.3"
        scale="0.2 0.2 0.2"
        rotation="0 90 0">
      </a-entity>

      <!-- 閉じたどこでもドア -->
      <a-entity
        id="closedDoor"
        class="clickable"
        gltf-model="../cdoor.glb"
        position="-0.7 1.3 -1.4"
        scale="0.5 0.5 0.5"
        visible="true">
      </a-entity>

      <!-- 開いたどこでもドア -->
      <a-entity
        id="openDoor"
        gltf-model="door.glb"
        position="-0.7 1.3 -1.4"
        scale="0.5 0.5 0.5"
        visible="false">
      </a-entity>

      <!-- 富士山 -->
      <a-plane
        id="fujiPlane"
        src="../png/fuji.jpeg"
        position="-0.7 1.3 -1.5"
        width="0.7"
        height="1"
        visible="false">
      </a-plane>

      <!-- ビッグライト -->
      <a-entity
        id="box3"
        class="clickable"
        gltf-model="b.glb"
        position="-0.3 0.9 -0.4"
        scale="0.1 0.1 0.1">

        <!-- ライト（演出用：最初OFF） -->
        <a-light
          id="bigLightBeam"
          type="spot"
          intensity="1"
          angle="20"
          penumbra="0.4"
          distance="4"
          color="#ffffff"
          position="0 0 0.3"
          visible="false">
        </a-light>
      </a-entity>

      <!-- UI -->
      <a-entity id="menu" visible="false" position="-0.3 1.3 -0.8">
        <a-plane color="#222" width="1.2" height="0.6" opacity="0.85"></a-plane>

        <a-text
          id="menuTitle"
          align="center"
          position="0 0.20 0.05"
          width="1.0"
          color="#FFF">
        </a-text>

        <a-entity position="-0.33 -0.12 0">
          <a-box id="btnUse" class="menuBtn"
            color="#4CAF50"
            depth="0.05" height="0.144" width="0.44">
            <a-image src="../png/siyou.PNG"
              width="0.44" height="0.16" position="0 0 0.03">
            </a-image>
          </a-box>
        </a-entity>

        <a-entity position="0.33 -0.12 0">
          <a-box id="btnBack" class="menuBtn"
            color="#E53935"
            depth="0.05" height="0.144" width="0.44">
            <a-image src="../png/modo.PNG"
              width="0.44" height="0.16" position="0 0 0.03">
            </a-image>
          </a-box>
        </a-entity>
      </a-entity>

      <!-- カメラ -->
      <a-entity camera look-controls wasd-controls position="0 1.0 -1"></a-entity>

      <!-- 右コントローラ -->
      <a-entity
        id="ctlR"
        laser-controls="hand: right"
        raycaster="objects: .clickable, .menuBtn; showLine: true;">
      </a-entity>

    </a-scene>

    <script>
      let currentObject = null;
      let holdingBigLight = false;

      $('#closedDoor, #box3').on('click', function () {
        currentObject = this.id;
        $('#menuTitle').attr(
          'value',
          currentObject === 'closedDoor' ? 'どこでもドア' : 'ビッグライト'
        );
        $('#menu').attr('visible', true);
      });

      $('#btnUse').on('click', function () {

        if (currentObject === 'closedDoor') {
          $('#closedDoor').attr('visible', false);
          $('#openDoor').attr('visible', true);
          $('#fujiPlane').attr('visible', true);
        }

        if (currentObject === 'box3') {
          const light = document.querySelector('#box3');
          const controller = document.querySelector('#ctlR');

          controller.appendChild(light);
          light.setAttribute('position', '0 -0.05 -0.1');
          light.setAttribute('rotation', '-90 0 0');

          holdingBigLight = true;
        }

        $('#menu').attr('visible', false);
      });

      $('#btnBack').on('click', function () {
        $('#menu').attr('visible', false);
      });

      document.querySelector('#ctlR').addEventListener('triggerdown', () => {
        if (!holdingBigLight) return;
        document.querySelector('#bigLightBeam').setAttribute('visible', true);
      });

      document.querySelector('#ctlR').addEventListener('triggerup', () => {
        document.querySelector('#bigLightBeam').setAttribute('visible', false);
      });
    </script>
  </body>
</html>
