<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>部屋内で選択できるオブジェクト</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: true"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >

      <!-- 部屋 -->
      <a-entity gltf-model="heya_new.glb" position="0 1.5 -0.5" scale="1.2 1.2 1.2"></a-entity>

      <!-- ドラえもん -->
      <a-entity
        id="box1"
        class="clickable"
        gltf-model="dora.glb"
        position="-1.2 1.1 -0.3"
        scale="0.2 0.2 0.2"
        rotation="0 90 0"
      ></a-entity>
      
      

      <!-- どこでもドア -->
      <a-entity
        id="box2"
        class="clickable"
        gltf-model="door.glb"
        position="-0.7 1.3 -1.4"
        scale="0.5 0.5 0.5"
        rotation="0 220 0"
      ></a-entity>

      <!-- ビッグライト -->
      <a-entity
        id="box3"
        class="clickable"
        gltf-model="b.glb"
        position="-0.3 0.9 -0.4"
        scale="0.1 0.1 0.1"
        rotation="0 0 0"
      ></a-entity>

      <!-- UIパネル -->
		<a-entity id="menu" visible="false" position="-0.3 1.3 -0.8">
		  <a-plane color="#222" width="1.2" height="0.6" opacity="0.85"></a-plane>

		  <!-- タイトル -->
		  <a-text id="menuTitle"
		          value=""
		          align="center"
		          position="0 0.20 0.05"
		          width="1.8"
		          color="#FFF">
		  </a-text>

		  <!-- 使用するボタン -->
		  <a-entity position="-0.33 -0.12 0">
		    <a-box
		        id="btnUse"
		        class="menuBtn"
		        color="#4CAF50"
		        depth="0.05"
		        height="0.18"
		        width="0.55"
		        position="0 0 0">
		    </a-box>
		    
		  <!-- 戻るボタン -->
		  <a-entity position="0.33 -0.12 0">
		    <a-box
		        id="btnBack"
		        class="menuBtn"
		        color="#E53935"
		        depth="0.05"
		        height="0.18"
		        width="0.55"
		        position="0 0 0">
		    </a-box>


      <!-- カメラ -->
      <a-entity camera look-controls wasd-controls position="0 1.0 -1"></a-entity>

      <!-- VRコントローラー -->
      <a-entity id="ctlR" laser-controls="hand: right"
                raycaster="objects: .clickable, .menuBtn; showLine: true;">
      </a-entity>
    </a-scene>

    <script>
      let currentObject = null;

      // ドア or ビッグライトをクリック → メニューを表示
      $('#box2, #box3').on('click', function () {
        currentObject = this.id;
        $('#menuTitle').attr('value',
          currentObject === 'box2'
            ? 'どこでもドア'
            : 'ビッグライト'
        );
        $('#menu').attr('visible', true);
      });

      // 使用するボタン
      $('#btnUse').on('click', function () {
        if (!currentObject) return;

        if (currentObject === 'box2') {
          alert("どこでもドアを使用！");
          // ワープ処理ここ
        }
        if (currentObject === 'box3') {
          alert("ビッグライトを使用！");
          // 巨大化処理ここ
        }
        $('#menu').attr('visible', false);
      });

      // 戻るボタン
      $('#btnBack').on('click', function () {
        $('#menu').attr('visible', false);
      });
    </script>
  </body>
</html>
