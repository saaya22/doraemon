<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>部屋内で選択できるオブジェクト</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
<a-scene
  vr-mode-ui="enabled: true"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable"
>

  <!-- ===== 巨大化対象まとめ ===== -->
  <a-entity id="world" scale="1 1 1">

    <!-- 部屋 -->
    <a-entity gltf-model="heya_new.glb"
              position="0 1.5 -0.5"
              scale="1.2 1.2 1.2"></a-entity>

    <!-- ドラえもん -->
    <a-entity id="box1" class="clickable"
              gltf-model="dora.glb"
              position="-1.2 1.1 -0.3"
              scale="0.2 0.2 0.2"
              rotation="0 90 0"></a-entity>

    <!-- 閉じたドア -->
    <a-entity id="closedDoor" class="clickable"
              gltf-model="../cdoor.glb"
              position="-0.7 1.3 -1.4"
              scale="0.5 0.5 0.5"
              rotation="0 400 0"
              visible="true"></a-entity>

    <!-- 開いたドア -->
    <a-entity id="openDoor" class="clickable"
              gltf-model="door.glb"
              position="-0.7 1.3 -1.4"
              scale="0.5 0.5 0.5"
              rotation="0 220 0"
              visible="false"></a-entity>

    <!-- 富士山 -->
    <a-plane id="fujiPlane"
             src="../png/fuji.jpeg"
             position="-0.7 1.3 -1.5"
             width="0.7"
             height="1"
             visible="false"></a-plane>

    <!-- ビッグライト（床） -->
    <a-entity id="box3" class="clickable"
              gltf-model="b.glb"
              position="-0.3 0.9 -0.4"
              scale="0.1 0.1 0.1"></a-entity>

  </a-entity>

  <!-- ===== UI ===== -->
  <a-entity id="menu" visible="false" position="-0.3 1.3 -0.8">
    <a-plane color="#222" width="1.2" height="0.6" opacity="0.85"></a-plane>

    <a-text id="menuTitle"
            align="center"
            position="0 0.2 0.05"
            width="1"
            color="#FFF"></a-text>

    <!-- 使用する -->
    <a-entity position="-0.33 -0.12 0">
      <a-box id="btnUse" class="menuBtn"
             color="#4CAF50"
             depth="0.05" height="0.144" width="0.44">
        <a-image src="../png/siyou.PNG"
                 width="0.44" height="0.16"
                 position="0 0 0.03"></a-image>
      </a-box>
    </a-entity>

    <!-- 戻る -->
    <a-entity position="0.33 -0.12 0">
      <a-box id="btnBack" class="menuBtn"
             color="#E53935"
             depth="0.05" height="0.144" width="0.44">
        <a-image src="../png/modo.PNG"
                 width="0.44" height="0.16"
                 position="0 0 0.03"></a-image>
      </a-box>
    </a-entity>
  </a-entity>

  <!-- ===== カメラ ===== -->
  <a-entity id="camera"
            camera
            look-controls
            wasd-controls
            position="0 1.0 -1"></a-entity>

  <!-- ===== 右コントローラー（ビッグライト装備） ===== -->
  <a-entity id="ctlR"
            laser-controls="hand: right"
            raycaster="objects: .clickable, .menuBtn">

    <!-- 手に持つビッグライト -->
    <a-entity id="bigLightHeld"
              gltf-model="b.glb"
              position="0 -0.05 -0.15"
              rotation="0 180 0"
              scale="0.05 0.05 0.05"
              visible="false"></a-entity>

    <!-- 光のビーム -->
    <a-cylinder id="bigLightBeam"
                position="0 -0.05 -0.45"
                rotation="90 0 0"
                radius="0.03"
                height="0.8"
                color="#FFFF99"
                opacity="0.75"
                visible="false"></a-cylinder>

    <!-- 発光 -->
    <a-light id="bigLightGlow"
             type="spot"
             color="#FFFFCC"
             intensity="4"
             angle="25"
             distance="3"
             position="0 -0.05 0"
             visible="false"></a-light>

  </a-entity>

</a-scene>

<script>
let currentObject = null;

$('#closedDoor, #box3').on('click', function () {
  currentObject = this.id;
  $('#menuTitle').attr('value',
    currentObject === 'closedDoor' ? 'どこでもドア' : 'ビッグライト'
  );
  $('#menu').attr('visible', true);
});

$('#btnUse').on('click', function () {
  if (!currentObject) return;

  // どこでもドア
  if (currentObject === 'closedDoor') {
    $('#closedDoor').attr('visible', false);
    $('#openDoor').attr('visible', true);
    $('#fujiPlane').attr('visible', true);
  }

  // ビッグライト
  if (currentObject === 'box3') {

    // 床のライトを消す
    $('#box3').attr('visible', false);

    // コントローラーに装備
    $('#bigLightHeld').attr('visible', true);
    $('#bigLightBeam').attr('visible', true);
    $('#bigLightGlow').attr('visible', true);

    // 少し溜めて巨大化
    setTimeout(() => {
      $('#world').attr('scale', '2 2 2');
      $('#camera').attr('position', '0 0.4 -1');
    }, 800);
  }

  $('#menu').attr('visible', false);
});

$('#btnBack').on('click', function () {
  $('#menu').attr('visible', false);
});
</script>

</body>
</html>
